[project]
name = "conduit"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible LLM gateway: routing, failover, caching, budgets, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ishan Singh Tomar" }]
keywords = ["llm", "gateway", "openai", "fastapi", "redis"]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "prometheus-client>=0.21.1",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "pyyaml>=6.0.2",
    "greenlet>=3.1.1",
]

[project.scripts]
conduit = "conduit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.6",
    "mypy>=1.14.1",
    "fakeredis>=2.26.2",
    "locust>=2.32.6",
    "types-pyyaml>=6.0.12.20240917",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/conduit/api/pages.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["conduit"]
mypy_path = "src"
plugins = []

[[tool.mypy.overrides]]
module = [
    "prometheus_client",
    "prometheus_client.*",
    "yaml",
    "fakeredis",
    "fakeredis.*",
    "opentelemetry",
    "opentelemetry.*",
    "asyncpg",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["conduit"]
branch = false
omit = []
