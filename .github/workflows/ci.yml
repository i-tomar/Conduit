name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Test
        run: uv run pytest --cov=conduit --cov-report=term-missing --cov-fail-under=85
